<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AppPack — выбери программы и установи</title>
<meta name="description" content="Выбери программы, игры и ИИ-приложения — и установи всё одной кнопкой на Windows.">
<meta property="og:type" content="website">
<meta property="og:title" content="AppPack — выбери программы и установи">
<meta property="og:description" content="Браузеры, игры, ИИ, утилиты и проверки ПК. Отметь нужное — и установка пойдёт сама.">
<meta property="og:image" content="https://notshido.github.io/apppack/bg.jpg">
<meta property="og:url" content="https://notshido.github.io/apppack/">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{color-scheme:dark;--card:rgba(62,62,67,.66);--card2:rgba(92,92,99,.78);--ink:#f2f2f4;--mute:#b6b6bd;--line:rgba(255,255,255,.15);--acc:#dcdce0;--acc-ink:#141416;--ok:#e6e6ea;--term:rgba(10,10,12,.78);--term-ink:#cfcfd6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.5 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;background:linear-gradient(rgba(8,8,10,.5),rgba(8,8,10,.72)),url("bg.jpg") center/cover fixed #0c0c0e}
.wrap{max-width:none;margin:0;padding:0 28px}
header{padding:22px 0 8px}
header h1{margin:0;font-size:28px;letter-spacing:-.02em;cursor:pointer;text-shadow:0 2px 12px #000}
header p{margin:4px 0 0;color:var(--mute)}
main{display:grid;grid-template-columns:230px 1fr 320px;gap:20px;padding:16px 0 48px;align-items:start}
@media (max-width:980px){main{grid-template-columns:210px 1fr}aside{grid-column:1/-1;position:static}}
#view,#center{min-width:0}
.search{margin-bottom:14px}
#q{width:100%;max-width:420px;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;backdrop-filter:blur(8px)}
#q::placeholder{color:var(--mute)}
.warn{margin:8px 0 0;padding:10px 14px;border-radius:10px;background:rgba(190,90,60,.28);border:1px solid rgba(255,140,100,.4);font-size:14px}
.tag{position:absolute;top:-8px;right:12px;font-size:11px;line-height:1;padding:3px 8px;border-radius:99px;background:#2b2b30;border:1px solid var(--line);color:var(--mute);pointer-events:none}
#cats{display:flex;flex-direction:column;gap:10px;position:sticky;top:16px}
.cat{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);backdrop-filter:blur(8px)}
.cat:hover{background:var(--card2)}
.cat.cur{background:var(--card2);border-color:var(--ok)}
.cat:focus-visible,.tile:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.cat .ic{font-size:24px;line-height:1;width:44px;height:44px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.1);flex:none;filter:grayscale(1)}
.cat .t{flex:1;min-width:0;display:flex;flex-direction:column}
.cat b{font-size:17px}
.cat small{color:var(--mute)}
.cat .n{font-weight:700;color:var(--acc-ink);background:var(--ok);border-radius:99px;min-width:22px;padding:0 7px;text-align:center;font-size:13px}
.cat .n:empty{display:none}
.top{margin-bottom:14px}
.top h2{margin:0;font-size:24px;text-shadow:0 2px 10px #000}
.blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),300px));justify-content:start;gap:14px;align-items:start}
.blk{min-width:0;background:rgba(30,30,34,.5);border:1.5px solid var(--line);border-radius:16px;padding:14px;backdrop-filter:blur(8px)}
.blk h3{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.blk .apps{grid-template-columns:minmax(0,1fr)}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),250px));justify-content:start;gap:10px}
.tile{all:unset;box-sizing:border-box;min-width:0;height:68px;position:relative;cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);backdrop-filter:blur(8px)}
.tile:hover{background:var(--card2)}
.tile.on{border-color:var(--ok);background:var(--card2)}
.ava{position:relative;overflow:hidden;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:18px;color:#fff;background:#6d6d75;flex:none}
.ava img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:3px;background:transparent}
.ava:has(img){background:transparent}
.ava:has(img) .lt{display:none}
.tile div{flex:1;min-width:0}
.tile b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:700;color:var(--acc-ink)}
.on .chk{background:var(--ok);border-color:var(--ok)}
.on .chk::after{content:"✓"}
aside{position:sticky;top:16px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px;backdrop-filter:blur(10px)}
aside h3{margin:0 0 10px;font-size:18px}
.list{max-height:200px;overflow:auto;margin:0 0 12px;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.list button{all:unset;cursor:pointer;color:var(--mute);padding:0 6px}
.empty{color:var(--mute);font-size:14px;margin:0 0 12px}
.btn{all:unset;box-sizing:border-box;display:block;width:100%;text-align:center;cursor:pointer;padding:12px;border-radius:10px;font-weight:600;margin-top:8px}
.btn.main{background:var(--acc);color:var(--acc-ink)}
.btn.alt{border:1.5px solid var(--line)}
.btn.alt:hover{background:var(--card2)}
.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed}
pre{margin:12px 0 0;padding:12px;border-radius:8px;background:var(--term);color:var(--term-ink);font:12.5px/1.5 Consolas,"Cascadia Mono",monospace;max-height:170px;overflow:auto;white-space:pre-wrap;word-break:break-all}
#msg a{color:var(--ink);text-decoration:underline}
#msg{min-height:20px;margin:8px 0 0;font-size:13px;color:var(--mute)}
body.mob #cats,body.mob aside,body.mob #os{display:none}
body.mob main{grid-template-columns:minmax(0,1fr)}
.go{font-size:24px;line-height:1;color:var(--mute);width:24px;text-align:center;flex:none}
#bar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(12,12,14,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);align-items:center;justify-content:space-between;gap:12px}
#bar .btn{width:auto;margin:0;padding:12px 26px}
#barcnt{font-weight:600}
#toast{display:none;position:fixed;left:14px;right:14px;bottom:78px;z-index:40;padding:12px 14px;border-radius:12px;background:rgba(34,34,38,.97);border:1px solid var(--line);font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
@media (max-width:640px){
  .wrap{padding:0 14px}
  header{padding:14px 0 6px}
  header h1{font-size:24px}
  main{grid-template-columns:minmax(0,1fr);gap:14px;padding:8px 0 100px}
  #cats{flex-direction:row;overflow-x:auto;position:sticky;top:0;z-index:20;gap:8px;padding:8px 14px;margin:0 -14px;background:rgba(10,10,12,.85);backdrop-filter:blur(10px);scrollbar-width:none}
  #cats::-webkit-scrollbar{display:none}
  .cat{flex:none;padding:8px 12px;gap:8px;border-radius:12px}
  .cat .ic{width:30px;height:30px;font-size:17px;border-radius:8px}
  .cat b{font-size:15px;white-space:nowrap}
  .cat small{display:none}
  .apps,.blk .apps,.blocks{grid-template-columns:minmax(0,1fr)}
  #q{max-width:none}
  aside{position:static}
  #bar{display:flex}
  body.mob #bar{display:none}
  body.mob main{padding-bottom:24px}
  #toast.show{display:block}
}
</style>
</head>
<body>
<header class="wrap">
  <h1 id="home">AppPack</h1>
  <p>Отметь нужные программы и нажми «Установить».</p>
  <p id="os" class="warn" hidden>Установка работает только на компьютерах с Windows 10/11. С этого устройства можно только собрать список и отправить ссылку.</p>
</header>
<main class="wrap">
  <nav id="cats" aria-label="Разделы"></nav>
  <div id="center">
    <div class="search"><input id="q" type="search" placeholder="Поиск по всем программам…" autocomplete="off" aria-label="Поиск"></div>
    <section id="view" aria-live="polite"></section>
  </div>
  <aside>
    <h3>Выбрано: <span id="cnt">0</span></h3>
    <p class="empty" id="empty">Пока ничего. Открой раздел и отметь программы.</p>
    <ul class="list" id="list"></ul>
    <button class="btn main" id="go" aria-disabled="true">Установить</button>
    <button class="btn alt" id="share">Скопировать ссылку на набор</button>
    <button class="btn alt" id="upg">Обновить все программы</button>
    <button class="btn alt" id="clear">Очистить выбор</button>
    <p id="msg"></p>
  </aside>
</main>
<div id="bar"><span id="barcnt">Выбрано: 0</span><button class="btn main" id="bargo" aria-disabled="true">Установить</button></div>
<div id="toast" role="status"></div>

const MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || /[?&]mobile=1/.test(location.search);
const IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
const CATS = CATS_ALL.filter(c => !!c.mob === MOBILE);
CATS.forEach(c => c.apps.forEach(a => a.k = a.w || a.n));
/* ================================== */

const ALL = CATS.flatMap(c => c.apps.map(a => ({...a, color:c.color, cat:c.name})));
const sel = new Set();
let Q = '';
const $ = id => document.getElementById(id);
let open = 0;
try{ const v = parseInt(localStorage.getItem('apppack-open'), 10); if(v >= 0 && v < CATS.length) open = v; }catch(e){}
(function(){
  const valid = new Set(ALL.map(a => a.k)); let arr = [];
  try{
    const h = location.hash.match(/^#set=(.*)$/);
    if(h){ arr = h[1].split('~').map(decodeURIComponent); history.replaceState(null, '', location.pathname + location.search); }
    else arr = JSON.parse(localStorage.getItem('apppack-sel') || '[]');
  }catch(e){}
  arr.forEach(k => { if(valid.has(k)) sel.add(k); });
})();
const WIN = /Windows/i.test(navigator.userAgent);
if(MOBILE){
  document.body.classList.add('mob');
  $('q').placeholder = 'Поиск приложений…';
  document.querySelector('header p').textContent = 'Нажми на приложение — откроется ' + (IOS ? 'App Store' : 'Google Play') + '.';
} else if(!WIN) $('os').hidden = false;

const slug = n => n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
/* иконки: быстрый источник Google (без редиректа) -> DuckDuckGo -> буква; найденный адрес запоминается, всё грузится заранее */
const SRC = [a => `https://t2.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=https://${a.s.split('/')[0]}&size=64`, a => `https://icons.duckduckgo.com/ip3/${a.s.split('/')[0]}.ico`];
const ICON = {};
const own = a => [].concat(a.i || []);
const chain = a => own(a).concat(SRC.map(f => f(a)));  /* a.i — свой файл иконки, берётся первым */
function nextIcon(img, fail){
  const k = img.dataset.k; if(img.dataset.s === 'done') return;
  const a = ALL.find(x => x.k === k), ch = chain(a); let n = +img.dataset.s; const last = n >= ch.length - 1;
  if(!fail && (img.naturalWidth > 16 || last)){ ICON[k] = img.src; img.dataset.s = 'done'; if(n >= own(a).length && !a.raw && !img.src.startsWith('data:')) strip(k, img.src); return; }
  if(last){ ICON[k] = ''; img.remove(); return; }
  img.dataset.s = ++n; img.src = ch[n];
}
document.addEventListener('error', e => { if(e.target.dataset && e.target.dataset.k) nextIcon(e.target, true); }, true);
document.addEventListener('load', e => { if(e.target.dataset && e.target.dataset.k) nextIcon(e.target, false); }, true);
/* у многих иконок белый квадрат — часть самой картинки. Вырезаем белый фон, связанный с краями; тёмные одноцветные логотипы делаем белыми */
function strip(k, url){
  const tries = ['https://wsrv.nl/?output=png&url=' + encodeURIComponent(url)];  /* напрямую Google/DDG не отдают CORS, поэтому только через прокси */
  const go = i => {
    if(i >= tries.length) return;
    const im = new Image(); im.crossOrigin = 'anonymous';
    im.onerror = () => go(i + 1);
    im.onload = () => { try{
      const w = im.naturalWidth, h = im.naturalHeight, c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.drawImage(im, 0, 0);
      const d = x.getImageData(0, 0, w, h), p = d.data;
      const wh = q => p[q+3] > 200 && p[q] > 235 && p[q+1] > 235 && p[q+2] > 235;
      const seen = new Uint8Array(w * h), st = [];
      const push = (a, b) => { if(a < 0 || b < 0 || a >= w || b >= h) return; const n = b * w + a; if(seen[n] || !wh(n * 4)) return; seen[n] = 1; st.push(n); };
      for(let a = 0; a < w; a++){ push(a, 0); push(a, h - 1); }
      for(let b = 0; b < h; b++){ push(0, b); push(w - 1, b); }
      let cut = 0;
      while(st.length){ const n = st.pop(), a = n % w, b = (n / w) | 0; p[n*4+3] = 0; cut++; push(a+1, b); push(a-1, b); push(a, b+1); push(a, b-1); }
      if(cut < w * h * 0.08) return;
      let sum = 0, sat = 0, cnt = 0;
      for(let q = 0; q < p.length; q += 4) if(p[q+3] > 128){ sum += (p[q] + p[q+1] + p[q+2]) / 3; sat += Math.max(p[q], p[q+1], p[q+2]) - Math.min(p[q], p[q+1], p[q+2]); cnt++; }
      if(cnt && sum / cnt < 90 && sat / cnt < 40) for(let q = 0; q < p.length; q += 4){ p[q] = p[q+1] = p[q+2] = 255; }
      x.putImageData(d, 0, 0);
      const out = c.toDataURL('image/png'); ICON[k] = out;
      document.querySelectorAll('img[data-k]').forEach(el => { if(el.dataset.k === k) el.src = out; });
    }catch(e){ go(i + 1); } };
    im.src = tries[i];
  };
  go(0);
}
function preload(){
  ALL.forEach(a => { if(ICON[a.k] !== undefined) return;
    const im = new Image(); im.dataset.k = a.k; im.dataset.s = '0';
    im.onload = () => nextIcon(im, false); im.onerror = () => nextIcon(im, true);
    im.src = chain(a)[0]; });
}

const kind = a => a.w ? (a.src ? 'store' : 'auto') : (a.dl ? 'dl' : (a.iso ? 'iso' : 'site'));
const TAG = {store:['Microsoft Store','Установится через Microsoft Store (нужен работающий магазин)'], dl:['скачает и запустит','Установщик скачается сам и запустится'], iso:['скачает ISO','ISO скачается сам в папку «Загрузки» (если не получится — откроется официальный сайт)'], site:['откроет сайт','Автоустановки нет: откроется официальная страница загрузки']};
function renderView(){
  const q = Q.trim().toLowerCase();
  $('cats').innerHTML = CATS.map((c,i) => {
    const k = c.apps.filter(a => sel.has(a.k)).length;
    return `<button class="cat${i===open && !q?' cur':''}" data-cat="${i}"><span class="ic">${c.ic}</span><span class="t"><b>${c.name}</b><small>${c.apps.length} программ</small></span><span class="n">${k||''}</span></button>`;
  }).join('');
  const storeLink = a => IOS
    ? (a.m.i || 'itms-apps://search.itunes.apple.com/WebObjects/MZSearch.woa/wa/search?media=software&term=' + encodeURIComponent(a.m.q))
    : (a.m.a || 'https://play.google.com/store/search?q=' + encodeURIComponent(a.m.q) + '&c=apps');
  const tile = a => { const kd = a.m ? 'store' : kind(a);
    const ava = `<span class="ava"><span class="lt">${a.n[0]}</span>${ICON[a.k] === '' ? '' : `<img data-k="${a.k}" data-s="${ICON[a.k] ? 'done' : 0}" src="${ICON[a.k] || chain(a)[0]}" alt="" decoding="async">`}</span>`;
    if(a.m) return `<a class="tile" href="${storeLink(a)}" target="_blank" rel="noopener" title="${a.n} — ${a.d}"><span class="tag">${IOS ? 'App Store' : 'Google Play'}</span>${ava}<div><b>${a.n}</b><small>${a.d}</small></div><span class="go">›</span></a>`;
    return `<button class="tile${sel.has(a.k)?' on':''}" title="${a.n} — ${a.d}${kd==='auto'?'':'. '+TAG[kd][1]}" data-app="${a.k}" aria-pressed="${sel.has(a.k)}">${kd==='auto'?'':`<span class="tag">${TAG[kd][0]}</span>`}${ava}<div><b>${a.n}</b><small>${a.d}</small></div><span class="chk"></span></button>`; };
  const grid = list => '<div class="apps">' + list.map(tile).join('') + '</div>';
  if(q){
    const res = ALL.filter(a => (a.n + ' ' + a.d + ' ' + (a.g || '') + ' ' + a.cat + ' ' + (a.w || '')).toLowerCase().includes(q));
    $('view').innerHTML = `<div class="top"><h2>Поиск: найдено ${res.length}</h2></div>` + (res.length ? grid(res) : '<p class="empty">Ничего не нашлось. Попробуй другое слово.</p>');
    return;
  }
  const c = CATS[open];
  let body;
  if(c.apps.some(a => a.g)){
    const gs = [...new Set(c.apps.map(a => a.g || 'Другое'))];
    body = '<div class="blocks">' + gs.map(g => `<div class="blk"><h3>${g}</h3>` + grid(c.apps.filter(a => (a.g || 'Другое') === g)) + '</div>').join('') + '</div>';
  } else body = grid(c.apps);
  $('view').innerHTML = `<div class="top"><h2>${c.name}</h2></div>` + body;
}

function renderPanel(){
  const ids = [...sel];
  $('cnt').textContent = ids.length;
  $('empty').hidden = ids.length > 0;
  $('list').innerHTML = ids.map(id => `<li>${ALL.find(a => a.k === id).n}<button data-rm="${id}" aria-label="Убрать">✕</button></li>`).join('');
  $('go').setAttribute('aria-disabled', ids.length ? 'false' : 'true');
  $('share').setAttribute('aria-disabled', ids.length ? 'false' : 'true');
  $('barcnt').textContent = 'Выбрано: ' + ids.length;
  $('bargo').setAttribute('aria-disabled', ids.length ? 'false' : 'true');
}

function refresh(){ renderView(); renderPanel(); try{ localStorage.setItem('apppack-open', open); localStorage.setItem('apppack-sel', JSON.stringify([...sel])); }catch(e){} }
function toast(t){
  if(!t || !matchMedia('(max-width:640px)').matches) return;
  const el = $('toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(window.__tt); window.__tt = setTimeout(() => el.classList.remove('show'), 5000);
}
function say(t){ $('msg').textContent = t; toast(t); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-cat],[data-back],[data-app],[data-rm]');
  if(!t) return;
  if(t.dataset.cat !== undefined){ open = +t.dataset.cat; Q = ''; $('q').value = ''; }
  else if(t.dataset.back !== undefined) open = null;
  else {
    const id = t.dataset.app || t.dataset.rm;
    sel.has(id) ? sel.delete(id) : sel.add(id);
  }
  say(''); refresh();
});
$('home').onclick = () => { open = 0; Q = ''; $('q').value = ''; refresh(); };
$('q').oninput = e => { Q = e.target.value; renderView(); };
$('q').onkeydown = e => { if(e.key === 'Escape'){ Q = ''; e.target.value = ''; renderView(); } };
$('clear').onclick = () => { sel.clear(); say(''); refresh(); };

/* версия считается из списка программ сама: изменился список — у всех один раз скачается новый установщик */
const SETUP_V = (() => { const t = ALL.map(a => [a.k, a.w ? '' : a.n, a.u || '', a.dl ? 1 : 0, a.iso ? a.iso.join('^') : '', a.src || '', a.kk || ''].join('~')).join('|'); let h = 5381; for(let i = 0; i < t.length; i++) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0; return 'v' + h.toString(36); })();
const pkey = a => a.kk || slug(a.n);
function protoUrl(){
  const L = [...sel].map(id => ALL.find(x => x.k === id));
  return 'apppack://install?ids=' + L.filter(a => a.w).map(a => a.w).join(',') + '&p=' + L.filter(a => !a.w).map(pkey).join(',');
}
function setupBat(url){
  const W = ALL.filter(a => a.w).map(a => `'${a.w}'`).join(',');
  const MS = ALL.filter(a => a.src).map(a => `'${a.w}'`).join(',');
  const P = ALL.filter(a => !a.w && !a.dl).map(a => `'${pkey(a)}'='${a.u}'`).join(';');
  const D = ALL.filter(a => !a.w && a.dl).map(a => `'${pkey(a)}'='${a.u}'`).join(';');
  const I = ALL.filter(a => !a.w && a.iso).map(a => `'${pkey(a)}'=@('${a.iso[0]}','${a.iso[1]}','${a.iso[2]}')`).join(';');
  const ps = `$d = Join-Path $env:LOCALAPPDATA 'AppPack'
New-Item -ItemType Directory -Force -Path $d | Out-Null
$hp = Join-Path $d 'handler.ps1'
$h = @'
param([string]$u)
$ok = @(${W})
$ms = @(${MS})
$pg = @{${P}}
$dl = @{${D}}
$iso = @{${I}}
Add-Type -AssemblyName PresentationFramework
function Note($t){ [void][System.Windows.MessageBox]::Show($t, 'AppPack') }
$me = [Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()
if(-not $me.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)){
  try{ Start-Process powershell.exe -Verb RunAs -ArgumentList ('-NoProfile -ExecutionPolicy Bypass -File "{0}" "{1}"' -f $PSCommandPath, $u) }
  catch{ Note 'Нужно нажать «Да» в окне Windows, иначе установка невозможна. Попробуй ещё раз.' }
  exit
}
$mode = 'install'; $ids = @(); $pages = @()
if($u -like 'apppack://upgrade*'){ $mode = 'upgrade' }
else {
  $q = ($u -split '\\?', 2)[1]
  foreach($kv in ($q -split '&')){
    $p = $kv -split '=', 2
    if($p[0] -eq 'ids'){ $ids = $p[1] -split ',' }
    if($p[0] -eq 'p'){ $pages = $p[1] -split ',' }
  }
}
$ids = @($ids | Where-Object { $ok -contains $_ })
$pages = @($pages | Where-Object { $pg.ContainsKey($_) -or $dl.ContainsKey($_) -or $iso.ContainsKey($_) })
if(($mode -eq 'upgrade' -or $ids.Count -gt 0) -and -not (Get-Command winget -ErrorAction SilentlyContinue)){
  Note 'На этом компьютере не найден winget. Обнови «Установщик приложений» (App Installer) в Microsoft Store: сейчас откроется его страница.'
  Start-Process 'https://apps.microsoft.com/detail/9nblggh4nns1'
  exit
}
$fail = @(); $done = @()
$skip = @(0, -1978335189, -1978335135)
if($mode -eq 'upgrade'){
  Write-Host 'Updating all apps'
  winget upgrade --all --silent --accept-package-agreements --accept-source-agreements
  if($skip -notcontains $LASTEXITCODE){ $fail += 'часть обновлений' }
}
foreach($id in $ids){
  Write-Host "Installing $id"
  if($ms -contains $id){ winget install --id $id --source msstore --silent --accept-package-agreements --accept-source-agreements }
  else { winget install --id $id -e --silent --accept-package-agreements --accept-source-agreements }
  if($skip -notcontains $LASTEXITCODE){ $fail += $id }
}
foreach($p in $pages){
  if($dl.ContainsKey($p)){
    try{
      $f = Join-Path $env:TEMP ($p + '.exe')
      Write-Host "Downloading $p"
      Invoke-WebRequest -Uri $dl[$p] -OutFile $f -UseBasicParsing
      Start-Process $f -Wait
      Remove-Item $f -Force -ErrorAction SilentlyContinue
    } catch { $fail += $p }
  } elseif($iso.ContainsKey($p)){
    try{
      $sp = $iso[$p]; $base = $sp[0]
      if($sp[1]){
        $l = (Invoke-WebRequest $base -UseBasicParsing).Content
        $d = [regex]::Matches($l, $sp[1]) | ForEach-Object { $_.Groups[1].Value } | Sort-Object { [version]$_ } | Select-Object -Last 1
        $base = $base + $d + '/'
      }
      $l = (Invoke-WebRequest $base -UseBasicParsing).Content
      $f = [regex]::Matches($l, $sp[2]) | ForEach-Object { $_.Value } | Sort-Object -Unique | Select-Object -Last 1
      if(-not $f){ throw 'iso not found' }
      $dest = Join-Path ([Environment]::GetFolderPath('UserProfile')) ('Downloads\\' + $f)
      Write-Host "Downloading $f"
      Start-BitsTransfer -Source ($base + $f) -Destination $dest
      $done += $f
    } catch { Start-Process $pg[$p]; $fail += ($p + ' (ISO не скачался сам, открыл сайт)') }
  } else { Start-Process $pg[$p] }
}
if($done.Count -gt 0){ Note ('ISO сохранены в папке «Загрузки»: ' + ($done -join ', ')) }
if($fail.Count -gt 0){ Note ('Не удалось: ' + ($fail -join ', ') + '. Проверь интернет и попробуй ещё раз или поставь вручную.') }
elseif($done.Count -eq 0){ Write-Host 'Done'; Start-Sleep 4 }
'@
Set-Content -Path $hp -Value $h -Encoding UTF8
$k = 'HKCU:\\Software\\Classes\\apppack'
New-Item -Path $k -Value 'URL:AppPack' -Force | Out-Null
New-ItemProperty -Path $k -Name 'URL Protocol' -Value '' -Force | Out-Null
$cmd = ('powershell.exe -NoProfile -ExecutionPolicy Bypass -File "{0}" "%1"' -f $hp)
New-Item -Path ($k + '\\shell\\open\\command') -Value $cmd -Force | Out-Null
& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $hp '${url}'`;
  return ['@echo off','title AppPack setup',
    `powershell -NoProfile -ExecutionPolicy Bypass -Command "$t=[IO.File]::ReadAllText('%~f0'); $i=$t.IndexOf('::PS'+'BEGIN'); iex $t.Substring($i+9)"`,
    'echo.','echo AppPack: installing. Confirm the Windows prompt if it appears.','(goto) 2>nul & del "%~f0"','::PSBEGIN',ps].join('\r\n');
}
function saveFile(name, text){
  const b = new Blob([text], {type:'application/octet-stream'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
function download(url){
  saveFile('AppPack-install.bat', setupBat(url));
  try{ localStorage.setItem('apppack-ready', SETUP_V); }catch(e){}
  say('Файл скачан: открой его (двойной щелчок в панели загрузок) и подтверди запрос Windows. Всё поставится само, а в следующий раз установка начнётся сразу по кнопке.');
}
let lastUrl = '';
function run(url){
  lastUrl = url;
  let ready = false; try{ ready = localStorage.getItem('apppack-ready') === SETUP_V; }catch(e){}
  if(!ready) return download(url);
  const a = document.createElement('a'); a.href = url; a.click();
  $('msg').innerHTML = 'Если браузер спросил разрешение — нажми «Открыть». Ничего не произошло? <a href="#" id="redo">Скачать установщик заново</a>';
  toast('Если браузер спросил разрешение, нажми «Открыть».');
}
const NOWIN = 'Установка работает только на компьютерах с Windows 10/11.';
$('go').onclick = () => {
  if(!WIN) return say(NOWIN);
  if(!sel.size) return say('Сначала отметь хотя бы одну программу.');
  run(protoUrl());
};
$('bargo').onclick = () => $('go').click();
$('upg').onclick = () => { if(!WIN) return say(NOWIN); run('apppack://upgrade'); };
$('share').onclick = async () => {
  if(!sel.size) return say('Сначала отметь хотя бы одну программу.');
  const link = location.origin + location.pathname + '#set=' + [...sel].map(encodeURIComponent).join('~');
  try{ await navigator.clipboard.writeText(link); say('Ссылка скопирована. Кто её откроет, увидит эти программы уже отмеченными.'); }
  catch(e){ say(link); }
};
$('msg').addEventListener('click', e => { if(e.target.id === 'redo'){ e.preventDefault(); download(lastUrl || protoUrl()); } });


refresh();
preload();
</script>
